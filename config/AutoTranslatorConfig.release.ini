; 发布模式：关闭机翻，只使用 Translation 目录里的人工译文。
[Service]
Endpoint=
FallbackEndpoint=

[General]
Language=zh-CN
FromLanguage=en

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt

[TextFrameworks]
EnableUGUI=True
EnableUIElements=False
EnableNGUI=False
EnableTextMeshPro=True
EnableTextMesh=False
EnableIMGUI=False

[Behaviour]
MaxCharactersPerTranslation=400
EnableBatching=False
OverrideFont=
IgnoreWhitespaceInDialogue=False
MaxTextParserRecursion=15
OutputTooLongText=False


[Debug]
EnableConsole=False
EnableLog=False
