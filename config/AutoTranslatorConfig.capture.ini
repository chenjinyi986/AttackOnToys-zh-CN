; 开发采集模式：CustomTranslate 指向本地回显服务（scripts/capture_server.py），
; 让 XUnity 把运行时出现的所有英文文本原样写进 _AutoGeneratedTranslations.txt。
; 不可分发。
[Service]
Endpoint=CustomTranslate
FallbackEndpoint=

[General]
Language=zh-CN
FromLanguage=en

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt

[TextFrameworks]
EnableUGUI=True
EnableUIElements=False
EnableNGUI=False
EnableTextMeshPro=True
EnableTextMesh=True
EnableIMGUI=False

[Behaviour]
MaxCharactersPerTranslation=400
EnableBatching=False
OverrideFont=
IgnoreWhitespaceInDialogue=False
MaxTextParserRecursion=15
OutputTooLongText=True

[Custom]
Url=http://127.0.0.1:18080/translate

[Debug]
EnableConsole=False
EnableLog=False
